# Sandbox deployment. Supply secrets in Render, never in this file.
# Free web service; Supabase Cron triggers bounded durable settlement processing.
services:
  - type: web
    name: rally
    runtime: node
    plan: free
    region: oregon
    domains:
      - rally.gowthamsarveswaran.com
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: APP_ORIGIN
        value: https://rally.gowthamsarveswaran.com
      - key: RALLY_SETTLEMENT_MODE
        value: scheduled
      - key: RALLY_DEMO_ENABLED
        value: "true"
      - key: RALLY_DEMO_KEY
        sync: false
      - key: RALLY_DEMO_ACCESS_CODE
        sync: false
      - key: RALLY_SETTLEMENT_TRIGGER_KEY
        sync: false
      - key: RALLY_RATE_LIMIT_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: ASTRO_GATEWAY_URL
        sync: false
      - key: ASTRO_GATEWAY_API_KEY
        sync: false
      - key: MODEL_DEFAULT
        sync: false
      - key: RALLY_AI_WORKER_URL
        sync: false
      - key: RALLY_AI_WORKER_TOKEN
        sync: false
